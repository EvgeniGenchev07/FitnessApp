<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AthloBoostX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/profile_page_user.css">
</head>
<body>
    <div class="profile-card">
        <div class="profile-header">
            <div class="main-profile">
                <div class="profile-image"></div>
                <div class="profile-names">
                    <h1 class="username"></h1>
                </div>
            </div>
        </div>

        <div class="profile-body">
            <div class="profile-actions">
                <button id="follow-btn" class="follow">Последвай</button>
                <button class="message">Message</button>
                <section class="bio">
                    <div class="bio-header">
                    <i class="fa fa-info-circle"></i>
                        Био
                    </div>
                    <p class="bio-text">
                    </p>
                </section>
            </div>

            <div class="account-info">
                <div class="data">
                    <section class="data-item">
                        <h3 class="value"></h3>
                        <small class="title">Постове</small>
                    </section>
                    <section class="data-item">
                        <h3 class="value"></h3>
                        <small class="title">Последователи</small>
                    </section>
                    <section class="data-item">
                        <h3 class="value"></h3>
                        <small class="title">Последвани</small>
                    </section>
                </div>

                <div class="social-media">
                    <span>Последвай ме в:</span>
                    <a href="#" class="media-link"><i class="fab fa-facebook-square"></i></a>
                    <a href="#" class="media-link"><i class="fa-brands fa-square-x-twitter"></i></a>
                    <a href="#" class="media-link"><i class="fab fa-instagram-square"></i></a>
                </div>

                <div class="last-post">
                    <div class="post-cover">
                        <span class="last-badge">Последен пост</span>
                    </div>
                    <h3 class="post-title"></h3>
                    <button class="post-CTA">Виж</button>
                </div>
            </div>
        </div>
    </div>
   <script src="assets/js/profile_page_user.js"></script>
</body>
</html>
