<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/forgot_password.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h3>Reset Password</h3>
      <form>
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" placeholder="Enter your email" required />

        <label class="form-label" for="password">New Password</label>
        <input class="form-control" type="password" id="password" placeholder="Enter new password" required />

        <button type="submit" class="btn-primary">Reset Password</button>
      </form>
    </div>
  </div>
  <script src="assets/js/forgot_password.js"></script>
</body>
</html>
