<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавяне на упражнение</title>
    <link rel="stylesheet" href="assets/css/add_exercise.css">
</head>
<body>
    <div class="container">
        <h1>Add exercise</h1>
        <form action="#" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="exerciseName">Name:</label>
                <input type="text" id="exerciseName" name="exerciseName" placeholder="Enter the name..." required>
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" placeholder="Details..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="sets">Sets:</label>
                    <input type="number" id="sets" name="sets" min="1" max="20" placeholder="" required>
                </div>

                <div class="form-group">
                    <label for="reps">Reps:</label>
                    <input type="number" id="reps" name="reps" min="1" max="100" placeholder="" required>
                </div>
            </div>

            <div class="form-group">
                <label for="difficulty">Level:</label>
                <select id="difficulty" name="difficulty" required>
                    <option value="">--Choose the level--</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Mid</option>
                    <option value="hard">Hard</option>
                    <option value="expert">Extreme</option>
                </select>
            </div>

            <div class="form-group">
                <label for="exerciseImage">Photo(GIF):</label>
                <input type="file" id="exerciseImage" name="exerciseImage" accept="image/*,image/gif" required>
            </div>

            <button type="submit" id="submitBtn">ЗАПИШИ УПРАЖНЕНИЕТО</button>
        </form>
    </div>

    <script src="assets/js/add_exercise.js"></script>
</body>
</html>
