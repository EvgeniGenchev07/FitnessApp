<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AthloBoostX</title>
    <link rel="stylesheet" href="assets/css/post_preview.css">
</head>
<body>
    <div class="article-container">
        <header class="article-header">
            <h1 class="article-title"></h1>
            <div class="article-meta">
                <div>
                    Публикувано на:<span style="color: var(--accent-red)"></span> | Автор: <span style="color: var(--accent-red)"></span>
                </div>
                <div class="like-section">
                    <div class="thumb-wrapper">
                        <svg id="likeIcon" class="like-icon" viewBox="0 0 24 24">
                        <path d="M14 9V5a3 3 0 0 0-6 0v4" />
                        <path d="M5 15H3a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h2" />
                        <path d="M7 15V10a2 2 0 0 1 2-2h6.28a2 2 0 0 1 1.94 2.5l-.66 3a2 2 0 0 1-1.94 1.5H9a2 2 0 0 1-2-2Z" />
                        </svg>
                    </div>
                    <span class="like-count" id="likeCount">0</span>
                    </div>
            </div>
        </header>
        
        <img id="postImage" alt="Post image" src="https://images.unsplash.com/photo-1511512578047-dfb367046420?ixlib=rb-1.2.1&auto=format&fit=crop&w=1351&q=80" alt="Агресивна илюстрация" class="article-image">
        
        <div class="article-content">
        </div>
        
        <section class="comments-section">
            <h2 class="comments-title">КОМЕНТАРИ</h2>
            
            <div class="comment-form">
                <textarea class="comment-input" placeholder="ИЗКАЖИ СЕ... АКО СМЕЕШ" id="commentInput"></textarea>
                <button class="submit-btn" id="submitComment">ПУБЛИКУВАЙ</button>
            </div>
            
            <div class="comments-list" id="commentsList">
            </div>
        </section>
    </div>
    <script src="assets/js/post_preview.js"></script>
</body>
</html>
