<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AthloBoostX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/profile_page_edit.css">
</head>
<body>
    <div class="beast-container">
        <header class="beast-header">
            <div class="beast-logo">BEAST MODE</div>
            <a href="profile_page.html" class="beast-back-btn">Back to Profile</a>
        </header>
        
        <section class="profile-section">
            <div class="avatar-edit">
                <img src="https://via.placeholder.com/120" alt="Profile" class="avatar-img" id="avatar-preview">
                <label for="photo-upload" class="avatar-edit-btn">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="photo-upload" accept="image/*">
            </div>
            <div class="profile-info">
                <h1 class="username-display">BEAST_USER</h1>
                <p class="member-since">Member since: January 2023</p>
            </div>
        </section>
        
        <form class="edit-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" value="BEAST_USER" required>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" value="beast@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="height" class="form-label">Height (cm)</label>
                    <input type="number" id="height" class="form-control" value="185" min="50" max="255">
                </div>
                
                <div class="form-group">
                    <label for="weight" class="form-label">Weight (kg)</label>
                    <input type="number" id="weight" class="form-control" value="85" min="30" max="300" step="0.1">
                </div>
                
                <div class="form-group">
                    <label for="birthdate" class="form-label">Birth Date</label>
                    <input type="date" id="birthdate" class="form-control" value="1990-01-01">
                </div>
                
                <div class="form-group full-width">
                    <label for="bio" class="form-label">Bio</label>
                    <textarea id="bio" class="form-control" rows="4" placeholder="Tell us about yourself..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="facebook" class="form-label">Facebook</label>
                    <div class="social-input">
                        <span class="social-icon"><i class="fab fa-facebook-f"></i></span>
                        <input type="url" id="facebook" class="form-control" placeholder="https://facebook.com/yourprofile">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="twitter" class="form-label">X (Twitter)</label>
                    <div class="social-input">
                        <span class="social-icon"><i class="fa-brands fa-x-twitter"></i></span>
                        <input type="url" id="twitter" class="form-control" placeholder="https://twitter.com/yourprofile">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="instagram" class="form-label">Instagram</label>
                    <div class="social-input">
                        <span class="social-icon"><i class="fab fa-instagram"></i></span>
                        <input type="url" id="instagram" class="form-control" placeholder="https://instagram.com/yourprofile">
                    </div>
                </div>
            </div>
            
            <button type="submit" class="save-btn">Save Changes</button>
        </form>
    </div>

    <script src="assets/js/profile_page_edit.js"></script>
</body>
</html>
