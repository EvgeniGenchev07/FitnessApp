<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AthloBoostX</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="assets/css/signUp.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">
        <!-- Sign Up Form -->
        <div class="form-container" id="signup-form">
            <h3>Създай профил</h3>
            
            <form>
                <!-- Name Input -->
                <div class="mb-3">
                    <label for="name" class="form-label">Име</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                
                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label">Парола</label>
                    <input type="password" class="form-control" id="password" required>
                </div>

                <!-- Sign Up Button -->
                <button type="submit" class="btn btn-primary w-100 mb-3">Регистрация</button>

            </form>

            <div class="footer-links">
                <p>Имаш съществуващ профил?<a href="#" onclick="showLogin()">Вход</a></p>
            </div>
        </div>

        <!-- Login Form -->
        <div class="form-container" id="login-form">
            <h3>Вход</h3>
            
            <form>
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="login-email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="login-email" required>
                </div>
                
                <!-- Password Input -->
                <div class="mb-3">
                    <label for="login-password" class="form-label">Парола</label>
                    <input type="password" class="form-control" id="login-password" required>
                </div>

                <!-- Log In Button -->
                <button type="submit" class="btn btn-primary w-100 mb-3">Вход</button>

                <!-- Forgot Password Link -->
                <div class="footer-links">
                    <p><a href="#" onclick="showForgotPassword()">Забравена парола?</a></p>
                </div>
            </form>

            <div class="footer-links">
                <p>Нямаш профил? <a href="#" onclick="showSignUp()">Регистрация</a></p>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <div class="form-container" id="forgot-password-form">
            <h3>Нова парола</h3>
            
            <form>
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="forgot-email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="forgot-email" required>
                    <label for="new-password" class="form-label">Парола</label>
                    <input type="password" class="form-control" id="new-password">
                    <label for="new-password-check" class="form-label">Въведи отново</label>
                    <input type="password" class="form-control" id="new-password-check">
                </div>

                <!-- Reset Password Button -->
                <button type="submit" class="btn btn-primary w-100 mb-3">Смяна на парола</button>

                <!-- Back to Login Link -->
                <div class="footer-links">
                    <p><a href="#" onclick="showLogin()">Вход</a></p>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS and Icons (for Google and Facebook icons) -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
<script src="https://kit.fontawesome.com/a076d05399.js"></script>
<script src="assets/js/signUp.js"></script>
</body>
</html>
