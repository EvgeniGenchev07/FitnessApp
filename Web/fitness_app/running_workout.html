<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Workout Timer</title>
    <link rel="stylesheet" href="assets/css/running_workout.css">
</head>
<body>
    <div class="workout-container">
        <div class="workout-header">
            <h1>Smart Workout Timer</h1>
        </div>
        
        <div class="exercise-view">
            <div class="exercise-info">
                <div class="exercise-name" id="exerciseName">Ready to Start</div>
                <div class="exercise-visual">
                    <img id="exerciseGif" class="exercise-gif" src="" alt="Exercise will appear when started">
                </div>
            </div>
            
            <div class="timer-display" id="timerDisplay">00:00:00</div>
            <div class="progress-info" id="progressInfo">Press START to begin</div>
            
            <div class="controls">
                <button class="control-btn start-btn" id="startBtn">START</button>
                <button class="control-btn pause-btn" id="pauseBtn" disabled>PAUSE</button>
                <button class="control-btn next-btn" id="nextBtn" disabled>NEXT</button>
                <button class="control-btn finish-btn" id="finishBtn" disabled style="display: none;">FINISH</button>
                <button class="control-btn reset-btn" id="resetBtn" disabled>RESET</button>
            </div>
            
            <div class="completion-message" id="completionMessage">
                Workout Complete! Excellent Work! 💪
            </div>
        </div>
    </div>
    
    <script>
        // Enhanced workout data
        const workoutRoutine = [
            { 
                name: "Side Plank (Left)", 
                gif: "https://www.verywellfit.com/thmb/1I8FdPAtVYl1YlwX8Q0JZ7J9W5M=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Side-Plank-633a5b094c9e4c849c5d1e2d7c9a9a9e.gif",
                duration: 30
            },
            { 
                name: "Jumping Jacks", 
                gif: "https://www.verywellfit.com/thmb/1I8FdPAtVYl1YlwX8Q0JZ7J9W5M=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Jumping-Jacks-633a5b094c9e4c849c5d1e2d7c9a9a9e.gif",
                duration: 45
            },
            { 
                name: "Mountain Climbers", 
                gif: "https://www.verywellfit.com/thmb/1I8FdPAtVYl1YlwX8Q0JZ7J9W5M=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Mountain-Climber-633a5b094c9e4c849c5d1e2d7c9a9a9e.gif",
                duration: 40
            }
        ];

        // State management
        let currentExerciseIndex = 0;
        let totalSeconds = 0;
        let exerciseSeconds = 0;
        let timer;
        let isRunning = false;
        let isPaused = false;

        // DOM elements
        const exerciseNameEl = document.getElementById('exerciseName');
        const exerciseGifEl = document.getElementById('exerciseGif');
        const timerDisplayEl = document.getElementById('timerDisplay');
        const progressInfoEl = document.getElementById('progressInfo');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const nextBtn = document.getElementById('nextBtn');
        const finishBtn = document.getElementById('finishBtn');
        const resetBtn = document.getElementById('resetBtn');
        const completionMessageEl = document.getElementById('completionMessage');

        // Initialize workout
        function initWorkout() {
            currentExerciseIndex = 0;
            totalSeconds = 0;
            exerciseSeconds = 0;
            updateTimerDisplay();
            
            exerciseNameEl.textContent = "Ready to Start";
            exerciseGifEl.src = "";
            progressInfoEl.textContent = "Press START to begin";
            completionMessageEl.style.display = "none";
            
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            nextBtn.disabled = true;
            finishBtn.style.display = "none";
            nextBtn.style.display = "block";
            resetBtn.disabled = true;
            pauseBtn.textContent = "PAUSE";
        }

        // Start workout
        function startWorkout() {
            if (!isRunning) {
                isRunning = true;
                isPaused = false;
                timer = setInterval(updateTimer, 1000);
                
                loadCurrentExercise();
                
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                nextBtn.disabled = false;
                resetBtn.disabled = false;
                
                // Show proper navigation button
                updateNavButton();
            }
        }

        // Pause/resume workout
        function togglePause() {
            if (isRunning && !isPaused) {
                clearInterval(timer);
                isPaused = true;
                pauseBtn.textContent = "RESUME";
            } else {
                timer = setInterval(updateTimer, 1000);
                isPaused = false;
                pauseBtn.textContent = "PAUSE";
            }
        }

        // Move to next exercise
        function nextExercise() {
            if (currentExerciseIndex < workoutRoutine.length - 1) {
                currentExerciseIndex++;
                exerciseSeconds = 0;
                loadCurrentExercise();
                updateNavButton();
            }
        }

        // Complete workout
        function finishWorkout() {
            clearInterval(timer);
            isRunning = false;
            
            exerciseNameEl.textContent = "Workout Complete";
            exerciseGifEl.src = "";
            progressInfoEl.style.display = "none";
            completionMessageEl.style.display = "block";
            
            startBtn.disabled = true;
            pauseBtn.disabled = true;
            nextBtn.disabled = true;
            finishBtn.disabled = true;
            resetBtn.disabled = false;
        }

        // Update navigation button
        function updateNavButton() {
            const isLastExercise = currentExerciseIndex >= workoutRoutine.length - 1;
            nextBtn.style.display = isLastExercise ? "none" : "block";
            finishBtn.style.display = isLastExercise ? "block" : "none";
            finishBtn.disabled = false;
        }

        // Update timer
        function updateTimer() {
            totalSeconds++;
            exerciseSeconds++;
            updateTimerDisplay();
            
            // Check if exercise duration reached
            if (exerciseSeconds >= workoutRoutine[currentExerciseIndex].duration) {
                if (currentExerciseIndex < workoutRoutine.length - 1) {
                    nextExercise();
                } else {
                    finishWorkout();
                }
            }
        }

        // Load current exercise
        function loadCurrentExercise() {
            const exercise = workoutRoutine[currentExerciseIndex];
            exerciseNameEl.textContent = exercise.name;
            exerciseGifEl.src = exercise.gif;
            exerciseGifEl.alt = exercise.name;
            progressInfoEl.textContent = `Exercise ${currentExerciseIndex + 1} of ${workoutRoutine.length}`;
            exerciseSeconds = 0;
        }

        // Update timer display
        function updateTimerDisplay() {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            timerDisplayEl.textContent = 
                `${hours.toString().padStart(2, '0')}:` +
                `${minutes.toString().padStart(2, '0')}:` +
                `${seconds.toString().padStart(2, '0')}`;
        }

        // Event listeners
        startBtn.addEventListener('click', startWorkout);
        pauseBtn.addEventListener('click', togglePause);
        nextBtn.addEventListener('click', nextExercise);
        finishBtn.addEventListener('click', finishWorkout);
        resetBtn.addEventListener('click', initWorkout);

        // Initialize
        initWorkout();
    </script>
</body>
</html>
