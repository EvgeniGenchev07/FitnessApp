<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness App - Workout Timer</title>
  <style>
    :root {
      --primary-red: #e74c3c;
      --dark-red: #c0392b;
      --black: #222222;
      --dark-gray: #333333;
      --medium-gray: #555555;
      --light-gray: #f5f5f5;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background-color: var(--black);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .workout-container {
      width: 100%;
      max-width: 800px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--medium-gray);
    }

    .workout-header {
      background: linear-gradient(to right, var(--black), var(--dark-red));
      color: var(--white);
      padding: 25px;
      text-align: center;
      border-bottom: 2px solid var(--primary-red);
    }

    .timer-page {
      display: none;
      background-color: var(--black);
      padding: 20px;
      text-align: center;
    }

    .exercise-display {
      margin: 20px 0;
    }

    .current-exercise {
      color: var(--white);
      font-size: 1.8rem;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .exercise-gif-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--primary-red);
    }

    .exercise-gif {
      width: 100%;
      display: block;
    }

    .timer-display {
      font-size: 4rem;
      color: var(--primary-red);
      margin: 20px 0;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .timer-btn {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .start-btn {
      background-color: var(--primary-red);
      color: var(--white);
    }

    .pause-btn {
      background-color: var(--medium-gray);
      color: var(--white);
    }

    .next-btn {
      background-color: var(--dark-red);
      color: var(--white);
    }

    .completion-message {
      color: var(--white);
      font-size: 1.8rem;
      margin: 30px 0;
      display: none;
    }

    .exercise-progress {
      color: var(--light-gray);
      margin: 15px 0;
      font-size: 1.1rem;
    }

    @media (max-width: 600px) {
      .current-exercise {
        font-size: 1.4rem;
      }

      .timer-display {
        font-size: 3rem;
      }

      .timer-controls {
        flex-wrap: wrap;
      }

      .timer-btn {
        width: 100%;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="workout-container">
    <div class="workout-header">
      <h1>Workout Timer</h1>
    </div>

    <div class="timer-page" id="timerPage">
      <div class="exercise-display">
        <div class="current-exercise" id="currentExercise">Side Plank Left</div>
        <div class="exercise-gif-container">
          <img id="exerciseGifDemo" class="exercise-gif" src="" alt="Exercise Demonstration">
        </div>
      </div>

      <div class="timer-display" id="timerDisplay">00:00:00</div>

      <div class="exercise-progress" id="exerciseProgress">
        Exercise 1 of 3
      </div>

      <div class="timer-controls">
        <!-- Start/Pause buttons hidden for a global timer -->
        <button class="timer-btn next-btn" id="nextBtn">NEXT EXERCISE</button>
      </div>

      <div class="completion-message" id="completionMessage">
        Workout Complete! Great Job! 💪
      </div>
    </div>
  </div>

  <script>
    const exercises = [
      {
        name: "Side Plank Left",
        gif: "assets/ig/ok.gif",
        description: "Strengthens obliques, shoulders, and core while improving balance."
      },
      {
        name: "Jumping Jacks",
        gif: "https://www.verywellfit.com/thmb/1I8FdPAtVYl1YlwX8Q0JZ7J9W5M=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Jumping-Jacks-633a5b094c9e4c849c5d1e2d7c9a9a9e.gif",
        description: "Full-body cardiovascular exercise that improves coordination."
      },
      {
        name: "Mountain Climber",
        gif: "https://www.verywellfit.com/thmb/1I8FdPAtVYl1YlwX8Q0JZ7J9W5M=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Mountain-Climber-633a5b094c9e4c849c5d1e2d7c9a9a9e.gif",
        description: "Dynamic core exercise with cardiovascular benefits."
      }
    ];

    let currentExerciseIndex = 0;
    let timer;
    let seconds = 0;

    const timerPage = document.getElementById('timerPage');
    const currentExerciseEl = document.getElementById('currentExercise');
    const exerciseGifDemo = document.getElementById('exerciseGifDemo');
    const timerDisplay = document.getElementById('timerDisplay');
    const nextBtn = document.getElementById('nextBtn');
    const completionMessage = document.getElementById('completionMessage');
    const exerciseProgress = document.getElementById('exerciseProgress');

    function initWorkout() {
      timerPage.style.display = 'block';
      loadExercise(currentExerciseIndex);
      startTimer();
    }

    function loadExercise(index) {
      const exercise = exercises[index];
      currentExerciseEl.textContent = exercise.name;
      exerciseGifDemo.src = exercise.gif;
      exerciseGifDemo.alt = exercise.name + " demonstration";
      exerciseProgress.textContent = `Exercise ${index + 1} of ${exercises.length}`;
    }

    function startTimer() {
      timer = setInterval(() => {
        seconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      timerDisplay.textContent =
        `${hours.toString().padStart(2, '0')}:` +
        `${minutes.toString().padStart(2, '0')}:` +
        `${secs.toString().padStart(2, '0')}`;
    }

    function nextExercise() {
      currentExerciseIndex++;

      if (currentExerciseIndex < exercises.length) {
        loadExercise(currentExerciseIndex);
        completionMessage.style.display = 'none';
      } else {
        completionMessage.style.display = 'block';
        currentExerciseEl.style.display = 'none';
        exerciseGifDemo.style.display = 'none';
        document.querySelector('.timer-controls').style.display = 'none';
        exerciseProgress.style.display = 'none';
      }
    }

    nextBtn.addEventListener('click', nextExercise);

    initWorkout();
  </script>
</body>
</html>
