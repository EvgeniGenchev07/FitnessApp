<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AthloBoostX</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/profile_page.css">
</head>
<body>
    <!-- Header with Settings -->
    <div class="header-container">
        <i class="fas fa-cog settings-icon" onclick="toggleSettings(event)"></i>
        <div class="settings-dropdown" id="settingsDropdown">
            <div class="settings-option" onclick="navigateToEditPage()">
                <i class="fas fa-user-edit"></i> Edit Profile
            </div>
            <div class="settings-option" onclick="navigateToDashboard()">
                <i class="fas fa-chart-line"></i> Dashboard
            </div>
            <div class="settings-option" onclick="appendDeleteButton()">
                <i class="fas fa-trash-alt"></i> Delete Post
            </div>
            <div class="settings-option" onclick="navigateToMainPage()">
                <i class="fas fa-home"></i> Back to home
            </div>
            <div class="settings-option" onclick="deleteAccount()">
                <i class="fas fa-trash-alt"></i> Delete your аccount
            </div>
            <div class="settings-option" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Profile Header -->
        <div class="profile-header">
            <img src="avatar-placeholder.jpg" alt="Profile" class="profile-avatar">
            <div class="profile-info">
                <h1 class="profile-name"></h1>
                <ul class="profile-stats">
                     <li><span></span> posts</li>
                    <li><span></span> followers</li>
                    <li><span></span> Following</li>
                </ul>
                <p class="profile-bio">
                </p>
            </div>
        </div>
        <!-- Posts Grid -->
        <div class="profile-posts">
            <div class="post-item">
                <img src="post-placeholder.jpg" alt="Post">
                <div class="post-hover">
                    <span></span>
                    <span></span>
                </div>
            </div>
    <script src="assets/js/profile_page.js"></script>
</body>
</html>
